<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bezoekers · De Composiet Specialist</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Bezoekers">
<meta name="theme-color" content="#17130F">
<style>
:root{--ink:#17130F;--cream:#F7F4EE;--card:#fff;--gold:#C49A62;--gold2:#8A6238;--mut:#6f6458;--line:#ebe4d8;--green:#2e7d32;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--ink);color:var(--cream);padding:18px 16px 16px;padding-top:max(18px,env(safe-area-inset-top))}
header .w{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header small{display:block;color:#cdbfa9;font-size:13px;font-weight:500}
header button{background:none;border:1px solid #5b4e40;color:#cdbfa9;border-radius:10px;padding:7px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.tabs{display:flex;gap:6px;background:#ece5d9;padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -18px rgba(60,40,20,.3)}
.card h2{margin:0 0 4px;font-size:17px}
.card p.sub{margin:0 0 12px;color:var(--mut);font-size:13.5px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px 14px 12px;box-shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -18px rgba(60,40,20,.3)}
.kpi .l{font-size:13px;color:var(--mut);font-weight:600}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;font-weight:600}
.kpi.big{grid-column:1/-1;background:var(--ink);color:var(--cream)}
.kpi.big .l{color:#cdbfa9}.kpi.big .v{font-size:46px;color:#E2BE8C}
.up{color:var(--green)}.down{color:var(--red)}.kpi.big .up{color:#8fd694}.kpi.big .down{color:#ff9e9e}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .bar{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.today .bar{background:var(--gold2)}
.chart .n{font-size:10.5px;color:var(--mut);margin-bottom:2px;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:3px;margin-top:4px}.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .ic{font-size:19px;text-align:center}
.list .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .tr{height:6px;background:#f1ebe1;border-radius:3px;margin-top:5px;overflow:hidden}.list .tr i{display:block;height:100%;background:var(--gold);border-radius:3px}
.list .ct{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:42px}
.list .ct small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.tip{background:#F4E6CF;border:1px solid #E2C99E;color:#5a3d1c;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.setup{max-width:520px}
.setup ol{padding-left:20px;margin:8px 0 14px}.setup li{margin:6px 0}
.setup input{width:100%;font:inherit;padding:13px 12px;border:1px solid #d8cfc1;border-radius:12px;background:#fff}
.btn{display:inline-block;background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;text-decoration:none;margin-top:10px;width:100%;text-align:center}
.btn.o{background:none;border:1px solid #d8cfc1}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:10px}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px}
.spin{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<header><div class="w"><div><h1>Bezoekers</h1><small>decomposietspecialist.nl</small></div><button id="reload" type="button" hidden>↻ Ververs</button></div></header>
<main id="app"><div class="spin">Laden…</div></main>
<script>
(function(){
var SITE='https://decomposietspecialist.goatcounter.com',KEY='gc_token',app=document.getElementById('app');
var tok=null;try{tok=localStorage.getItem(KEY)}catch(e){}
var PER='7';try{PER=localStorage.getItem('gc_per')||'7'}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nf(n){return Number(n||0).toLocaleString('nl-NL')}
function iso(d){return d.toISOString().replace(/\.\d+Z$/,'Z')}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
var QUEUE=Promise.resolve(),LAST=0;
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function api(path,q,tries){var u=new URL(SITE+'/api/v0/'+path);Object.keys(q||{}).forEach(function(k){u.searchParams.set(k,q[k])});tries=tries||0;
 var job=QUEUE.then(function(){var gap=650-(Date.now()-LAST);return gap>0?wait(gap):0}).then(function(){LAST=Date.now();
  return fetch(u,{headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}}).catch(function(e){if(tries<4)return{retry:1};throw e})});
 QUEUE=job.catch(function(){});
 return job.then(function(r){if(r.retry)return wait(1500*(tries+1)).then(function(){return api(path,q,tries+1)});if(r.status===401||r.status===403)throw{auth:1};
  if(r.status===429&&tries<4)return wait(1200*(tries+1)).then(function(){return api(path,q,tries+1)});
  if(!r.ok)return r.text().then(function(t){throw{status:r.status,msg:t}});return r.json()})}

function setup(msg){
 document.getElementById('reload').hidden=true;
 app.innerHTML='<div class="card setup"><h2>Eenmalig instellen</h2><p class="sub">Deze pagina laat in gewone taal zien hoeveel mensen je website bekijken. Daarvoor is één keer een sleutel van GoatCounter nodig.</p>'+
 '<ol><li>Open <a href="'+SITE+'/user/api" target="_blank" rel="noopener"><b>deze link</b></a> en log in bij GoatCounter.</li><li>Tik op <b>New API token</b> (nieuwe sleutel).</li><li>Geef hem een naam, bijv. <b>telefoon</b>, en zet alleen een vinkje bij <b>Read statistics</b>.</li><li>Tik op <b>Create</b> en kopieer de lange code.</li><li>Plak de code hieronder.</li></ol>'+
 '<input id="tk" placeholder="Plak hier je sleutel" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="save" type="button">Opslaan en bekijken</button>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+
 '<p class="sub" style="margin-top:12px">De sleutel wordt alleen op deze telefoon bewaard.</p></div>';
 document.getElementById('save').onclick=function(){var v=document.getElementById('tk').value.trim();if(!v)return;tok=v;try{localStorage.setItem(KEY,v)}catch(e){}load()};
}

var PAGES={'/':['🏠','Homepage'],'/#home':['🏠','Homepage'],'/#schuttingen':['🧱','Schuttingen & prijzen'],'/#projecten':['📸','Projecten (foto\'s)'],'/#offerte':['📝','Offerte maken'],'/#contact':['📞','Contact'],'/voorwaarden/':['📄','Voorwaarden'],
 'offerte-verstuurd':['✅','Offerte verstuurd'],'klik-whatsapp':['💬','Op WhatsApp getikt'],'klik-bellen':['📱','Op Bellen getikt']};
function pageName(p,t){if(PAGES[p])return PAGES[p];var cm=/^\/composiet-schutting-([a-z-]+)\/?$/.exec(p);if(cm)return['📍','Stadspagina '+cm[1].replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()}).replace('Den Bosch',"'s-Hertogenbosch")];if(/^\/#/.test(p))return['📄',p.slice(2)];return['📄',t||p]}
function refIcon(n){n=(n||'').toLowerCase();if(!n||n==='(no referrer)'||n==='direct')return['🔗','Direct (link getypt of opgeslagen)'];
 if(n.indexOf('google')>-1)return['🔍','Google'];if(n.indexOf('facebook')>-1||n.indexOf('fb.')>-1)return['📘','Facebook'];if(n.indexOf('instagram')>-1)return['📷','Instagram'];if(n.indexOf('tiktok')>-1)return['🎵','TikTok'];if(n.indexOf('whatsapp')>-1)return['💬','WhatsApp'];if(n.indexOf('bing')>-1)return['🔍','Bing'];if(n.indexOf('marktplaats')>-1)return['🛒','Marktplaats'];return['🌐',n]}
var SYS={'ios':['📱','iPhone / iPad'],'android':['📱','Android-telefoon'],'windows':['💻','Windows-computer'],'macos':['💻','Mac'],'linux':['💻','Linux'],'chrome os':['💻','Chromebook']};
function sysName(n){var k=(n||'').toLowerCase();for(var s in SYS)if(k.indexOf(s)===0)return SYS[s];return['🖥️',n||'Onbekend']}
var LAND={'NL':'Nederland','BE':'België','DE':'Duitsland','FR':'Frankrijk','GB':'Verenigd Koninkrijk','US':'Verenigde Staten','PL':'Polen'};
function locName(s){var n=s.name||s.id||'';var c=(s.id||'').split('-')[0];var flag=c&&c.length===2?String.fromCodePoint.apply(null,c.toUpperCase().split('').map(function(x){return 127397+x.charCodeAt(0)})):'🌍';
 var nm=(s.id&&s.id.length===2&&LAND[c])?LAND[c]:n;return[flag,nm||'Onbekend']}

var PROV={'NB':'Noord-Brabant','LI':'Limburg','GE':'Gelderland','UT':'Utrecht','NH':'Noord-Holland','ZH':'Zuid-Holland','ZE':'Zeeland','OV':'Overijssel','DR':'Drenthe','GR':'Groningen','FR':'Friesland','FL':'Flevoland',
 'north brabant':'Noord-Brabant','noord-brabant':'Noord-Brabant','limburg':'Limburg','gelderland':'Gelderland','utrecht':'Utrecht','north holland':'Noord-Holland','noord-holland':'Noord-Holland','south holland':'Zuid-Holland','zuid-holland':'Zuid-Holland','zeeland':'Zeeland','overijssel':'Overijssel','drenthe':'Drenthe','groningen':'Groningen','friesland':'Friesland','fryslan':'Friesland','fryslân':'Friesland','flevoland':'Flevoland'};
var WERK={'Noord-Brabant':1,'Limburg':1,'Gelderland':1,'Utrecht':1};
function provName(i){var id=String(i.id||'').replace(/^NL-/,''),n=String(i.name||'');var nm=PROV[id]||PROV[n.toLowerCase()]||n||'Onbekend';if(!n&&!id)nm='Onbekend';return[WERK[nm]?'📍':'🗺️',nm+(WERK[nm]?' · werkgebied':'')]}
function list(items,tot,map,max){if(!items.length)return'<p class="empty">Nog geen gegevens in deze periode.</p>';
 var top=Math.max.apply(null,items.map(function(i){return i.count}))||1;
 return '<ul class="list">'+items.slice(0,max||8).map(function(i){var m=map(i);var pc=tot?Math.round(i.count/tot*100):0;
  return '<li><span class="ic">'+m[0]+'</span><div><div class="nm">'+esc(m[1])+'</div><div class="tr"><i style="width:'+Math.max(3,i.count/top*100)+'%"></i></div></div><span class="ct">'+nf(i.count)+(tot?'<small>'+pc+'%</small>':'')+'</span></li>'}).join('')+'</ul>'}

function range(per){var now=new Date(),end=new Date(now);end.setMinutes(59,59,0);var start;
 if(per==='1')start=sod(now);else if(per==='jaar')start=new Date(now.getFullYear(),0,1);else{start=sod(now);start.setDate(start.getDate()-(Number(per)-1))}
 var len=end-start,ps=new Date(start-len),pe=new Date(start-1000);return{s:start,e:end,ps:ps,pe:pe}}
function rq(r){return{start:iso(new Date(Math.floor(r.s/36e5)*36e5)),end:iso(new Date(Math.ceil(r.e/36e5)*36e5))}}
function delta(a,b){if(!b)return a?'<span class="d up">nieuw</span>':'';var p=Math.round((a-b)/b*100);if(p===0)return'<span class="d">gelijk aan vorige periode</span>';return'<span class="d '+(p>0?'up':'down')+'">'+(p>0?'▲ +':'▼ ')+p+'% t.o.v. vorige periode</span>'}
var LBL={'1':'vandaag','7':'de afgelopen 7 dagen','30':'de afgelopen 30 dagen','jaar':'dit jaar'};

function load(){
 if(!tok)return setup();
 document.getElementById('reload').hidden=false;
 var r=range(PER),q=rq(r),qp={start:iso(new Date(Math.floor(r.ps/36e5)*36e5)),end:iso(new Date(Math.floor(r.s/36e5)*36e5))};
 app.innerHTML=tabs()+'<div class="spin">Gegevens ophalen… (± 8 seconden)</div>';bindTabs();
 Promise.all([
  api('stats/total',Object.assign({},q)),
  api('stats/total',qp).catch(function(){return{total:0}}),
  api('stats/hits',Object.assign({limit:60,daily:true},q)),
  api('stats/toprefs',Object.assign({limit:10},q)),
  api('stats/locations',Object.assign({limit:10},q)),
  api('stats/systems',Object.assign({limit:10},q)),
  api('stats/locations/NL',Object.assign({limit:15},q)).catch(function(){return{stats:[]}}),
  api('stats/browsers',Object.assign({limit:8},q)).catch(function(){return{stats:[]}}),
  api('stats/sizes',Object.assign({limit:8},q)).catch(function(){return{stats:[]}}),
  api('stats/languages',Object.assign({limit:8},q)).catch(function(){return{stats:[]}}),
  PER==='1'?null:api('stats/total',{start:iso(sod(new Date())),end:iso(new Date(Math.ceil(Date.now()/36e5)*36e5))}).catch(function(){return{total:0}})
 ]).then(function(a){render(a[0],a[1],a[2],a[3],a[4],a[5],a[10]||a[0],a[6],a[7],a[8],a[9])}).catch(function(e){
  if(e&&e.auth){try{localStorage.removeItem(KEY)}catch(x){}tok=null;return setup('Deze sleutel werkt niet (meer). Maak een nieuwe aan en zet het vinkje bij "Read statistics".')}
  app.innerHTML=tabs()+'<div class="card"><h2>Even geen verbinding</h2><p class="sub">De gegevens konden niet worden opgehaald. Wacht een paar seconden en tik op Ververs.</p><p class="sub" style="font-size:12px">Code: '+esc((e&&e.status)||'netwerk')+' '+esc(((e&&e.msg)||String(e&&e.message||'')).slice(0,140))+'</p></div>';bindTabs()});
}
function tabs(){return'<div class="tabs">'+[['1','Vandaag'],['7','7 dagen'],['30','30 dagen'],['jaar','Dit jaar']].map(function(t){return'<button type="button" data-p="'+t[0]+'" class="'+(t[0]===PER?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>'}
function bindTabs(){app.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){PER=b.dataset.p;try{localStorage.setItem('gc_per',PER)}catch(e){}load()}})}

function render(tot,prev,hits,refs,locs,sys,today,prov,brw,siz,lng){
 var T=tot.total||0,events=(hits.hits||[]).filter(function(h){return h.event}),pages=(hits.hits||[]).filter(function(h){return!h.event});
 function ev(p){var h=events.find(function(x){return x.path===p});return h?h.count:0}
 var off=ev('offerte-verstuurd'),wa=ev('klik-whatsapp'),bel=ev('klik-bellen');
 var offView=(pages.find(function(h){return h.path==='/#offerte'})||{}).count||0;
 var h='';
 h+='<div class="hero"><div class="kpi big"><div class="l">Bezoekers '+LBL[PER]+'</div><div class="v">'+nf(T-(tot.total_events||0))+'</div>'+delta(T,prev.total||0)+'</div>';
 h+='<div class="kpi"><div class="l">Vandaag</div><div class="v">'+nf(today.total-(today.total_events||0))+'</div><span class="d" style="color:var(--mut)">bezoekers</span></div>';
 h+='<div class="kpi"><div class="l">Offerte bekeken</div><div class="v">'+nf(offView)+'</div><span class="d" style="color:var(--mut)">keer de offertetool</span></div>';
 h+='<div class="kpi"><div class="l">Offertes verstuurd</div><div class="v">'+nf(off)+'</div><span class="d" style="color:var(--mut)">via het formulier</span></div>';
 h+='<div class="kpi"><div class="l">WhatsApp / Bellen</div><div class="v">'+nf(wa)+' / '+nf(bel)+'</div><span class="d" style="color:var(--mut)">keer op getikt</span></div></div><div style="height:14px"></div>';
 var st=(tot.stats||[]);
 if(PER!=='1'&&st.length){var days=st.slice(PER==='jaar'?0:-Number(PER));
  if(PER==='jaar'){var mm={};days.forEach(function(d){var k=d.day.slice(0,7);mm[k]=(mm[k]||0)+d.daily});days=Object.keys(mm).sort().map(function(k){return{day:k,daily:mm[k]}})}
  var mx=Math.max.apply(null,days.map(function(d){return d.daily}))||1,td=new Date().toISOString().slice(0,10);
  var MN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],DG=['zo','ma','di','wo','do','vr','za'];
  function lab(d){if(d.length===7)return MN[Number(d.slice(5,7))-1];var x=new Date(d+'T12:00:00');return days.length<=7?DG[x.getDay()]:x.getDate()+''}
  var showN=days.length<=14;
  h+='<div class="card"><h2>Bezoekers per '+(PER==='jaar'?'maand':'dag')+'</h2><p class="sub">Hoe hoger de balk, hoe meer mensen je site die '+(PER==='jaar'?'maand':'dag')+' bekeken.</p><div class="chart">'+days.map(function(d){return'<div class="b'+(d.day===td?' today':'')+'">'+(showN||d.daily===mx?'<span class="n">'+d.daily+'</span>':'')+'<div class="bar" style="height:'+(d.daily/mx*100)+'%"></div></div>'}).join('')+'</div><div class="xl">'+days.map(function(d,i){return'<span>'+(days.length>16&&i%5&&i!==days.length-1?'':lab(d.day))+'</span>'}).join('')+'</div></div>';
 } else if(PER==='1'&&st.length){var hr=(st[st.length-1].hourly||[]);var mx2=Math.max.apply(null,hr)||1;
  h+='<div class="card"><h2>Bezoekers per uur (vandaag)</h2><p class="sub">Op welk uur mensen je site bekeken.</p><div class="chart">'+hr.map(function(v,i){return'<div class="b">'+(v===mx2&&v?'<span class="n">'+v+'</span>':'')+'<div class="bar" style="height:'+(v/mx2*100)+'%"></div></div>'}).join('')+'</div><div class="xl">'+hr.map(function(v,i){return'<span>'+(i%6?'':i+'u')+'</span>'}).join('')+'</div></div>'}

 // ===== extra inzichten =====
 var vis=T-(tot.total_events||0),stA=(tot.stats||[]),nd=Math.max(1,PER==='1'?1:(PER==='jaar'?stA.length:Number(PER)));
 var dsum={},hsum=new Array(24).fill(0),wsum=[0,0,0,0,0,0,0],DGL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
 stA.forEach(function(d){(d.hourly||[]).forEach(function(v,i){hsum[i]+=v});var x=new Date(d.day+'T12:00:00');wsum[x.getDay()]+=d.daily;dsum[d.day]=d.daily});
 var bestDay=Object.keys(dsum).sort(function(a,b){return dsum[b]-dsum[a]})[0],bestH=hsum.indexOf(Math.max.apply(null,hsum)),bestW=wsum.indexOf(Math.max.apply(null,wsum));
 function pc(a,b){return b?Math.round(a/b*1000)/10+'%':'–'}
 var ins='<div class="card"><h2>In één oogopslag</h2><p class="sub">Belangrijkste cijfers van '+LBL[PER]+'.</p><ul class="list">';
 function row(ic,t,v){ins+='<li><span class="ic">'+ic+'</span><div><div class="nm" style="white-space:normal">'+t+'</div></div><span class="ct">'+v+'</span></li>'}
 row('📊','Gemiddeld per dag',nf(Math.round(vis/nd)));
 if(bestDay&&dsum[bestDay]&&PER!=='1')row('🏆','Drukste dag: '+new Date(bestDay+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'}),nf(dsum[bestDay]));
 if(hsum[bestH])row('⏰','Drukste uur: '+bestH+':00 – '+(bestH+1)+':00',nf(hsum[bestH]));
 if(PER!=='1'&&wsum[bestW])row('📅','Beste dag van de week: '+DGL[bestW],nf(wsum[bestW]));
 row('📝','Bezoekers die de offertetool openen',pc(offView,vis));
 row('✅','Bezoekers die een offerte versturen',pc(off,vis));
 row('💬','Bezoekers die op WhatsApp of Bellen tikken',pc(wa+bel,vis));
 ins+='</ul><p class="sub" style="margin:10px 0 0;font-size:12px">Tip: plaats je berichten op Facebook en TikTok net vóór het drukste uur.</p></div>';
 // wanneer
